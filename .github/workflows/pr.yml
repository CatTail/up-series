name: Check pull request

on:
  pull_request:

# Read-only: fork pull requests run here too (first-time contributors need a maintainer's approval).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # validate (strict) → single-file vite build → check-dist
      - run: npm run build
      - name: Data changes, in words (see the job summary)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$GITHUB_BASE_REF" data | tar -x -C "$RUNNER_TEMP/base"
          node scripts/data-diff.ts "$RUNNER_TEMP/base/data" data >> "$GITHUB_STEP_SUMMARY"
      # One file that opens in any browser, offline: download it from this run's Artifacts.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/index.html
          archive: false
          retention-days: 14
